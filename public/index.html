<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Usage</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --surface: #fcfcfb;
    --border: #e4e3df;
    --grid: #ecebe7;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #8a8984;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --good: #1a7f37;
    --warn: #b26b00;
    --crit: #c9302c;
    --flash: #2a78d61f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110;
      --surface: #1a1a19;
      --border: #2c2c2a;
      --grid: #262624;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #8d8c86;
      --series-1: #3987e5;
      --series-2: #d95926;
      --good: #3fb950;
      --warn: #d29922;
      --crit: #f0605d;
      --flash: #3987e526;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2c2c2a; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c86;
    --series-1: #3987e5; --series-2: #d95926;
    --good: #3fb950; --warn: #d29922; --crit: #f0605d; --flash: #3987e526;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .label { color: var(--text-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--good); animation: pulse 2s infinite; }
  .dot.err { background: var(--crit); }
  @keyframes pulse { 50% { opacity: .35; } }
  button {
    font: inherit; font-size: 12px; color: var(--text-2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { color: var(--text); }
  button[aria-pressed="true"] { color: var(--text); border-color: var(--text-2); }

  .error { background: var(--surface); border: 1px solid var(--crit); color: var(--crit);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; display: none; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .k { color: var(--text-2); font-size: 12px; }
  .tile .v { font-size: 24px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
  .tile .s { color: var(--muted); font-size: 12px; margin-top: 2px; min-height: 17px; }
  .meter { height: 6px; background: var(--grid); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--series-1); border-radius: 3px; transition: width .4s; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-h h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .card-h .sub { color: var(--muted); font-size: 12px; }
  .card-h .tools { margin-left: auto; display: flex; gap: 6px; }

  .chart { position: relative; height: 220px; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .axis text { fill: var(--muted); font-size: 11px; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none;
    box-shadow: 0 2px 8px #0000001a; z-index: 2;
  }
  .tip b { font-weight: 600; }
  .tip .m { color: var(--text-2); }
  .empty { color: var(--muted); font-size: 13px; display: grid; place-items: center; height: 100%; text-align: center; padding: 0 16px; }

  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  th:nth-child(2), td:nth-child(2), th:first-child, td:first-child { text-align: left; }
  td:nth-child(2) { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  tr.new td { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  .bad { color: var(--crit); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    background: var(--grid); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Token Usage</h1>
    <span class="label" id="keyLabel">—</span>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
  </header>

  <div class="error" id="error"></div>

  <section class="tiles">
    <div class="tile"><div class="k">Total used</div><div class="v" id="tTotal">—</div><div class="s" id="tTotalS"></div></div>
    <div class="tile"><div class="k">Today</div><div class="v" id="tDaily">—</div><div class="s">UTC</div></div>
    <div class="tile"><div class="k">This week</div><div class="v" id="tWeekly">—</div><div class="s"></div></div>
    <div class="tile"><div class="k">This month</div><div class="v" id="tMonthly">—</div><div class="s"></div></div>
    <div class="tile"><div class="k">Burn rate (last hour)</div><div class="v" id="tBurn">—</div><div class="s" id="tBurnS"></div></div>
    <div class="tile"><div class="k">Limit remaining</div><div class="v" id="tRemain">—</div><div class="s" id="tRemainS"></div><div class="meter"><div id="meter"></div></div></div>
  </section>

  <section class="card">
    <div class="card-h">
      <h2>Cumulative spend</h2>
      <span class="sub" id="spendSub"></span>
      <div class="tools" id="ranges">
        <button data-r="900000">15m</button>
        <button data-r="3600000" aria-pressed="true">1h</button>
        <button data-r="86400000">24h</button>
        <button data-r="0">All</button>
      </div>
    </div>
    <div class="chart" id="spendChart"></div>
  </section>

  <section class="card">
    <div class="card-h">
      <h2>Token per request</h2>
      <span class="sub" id="reqSub"></span>
      <div class="tools legend"><span><i style="background:var(--series-1)"></i>Input</span><span><i style="background:var(--series-2)"></i>Output</span></div>
    </div>
    <div class="chart" id="reqChart"></div>
  </section>

  <section class="card">
    <div class="card-h">
      <h2>Recent requests</h2>
      <span class="sub">via proxy</span>
      <div class="tools"><button id="resetBtn">Reset history</button></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>Model</th><th>Input</th><th>Output</th><th>Total</th><th>Cost</th><th>Latency</th></tr></thead>
        <tbody id="reqBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

let state = { key: null, snapshots: [], requests: [], error: null, lastPoll: null, pollMs: 5000 };
let range = 3600000;
try { range = Number(localStorage.getItem('range') ?? range); } catch {}

// ---------- formatting ----------
const usd = (n) => n == null ? '—' : '$' + (Math.abs(n) >= 100 ? n.toFixed(2) : Math.abs(n) >= 1 ? n.toFixed(3) : n.toFixed(4));
const int = (n) => n == null ? '—' : n.toLocaleString('en-US');
const compact = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'K' : String(n);
const time = (t) => new Date(t).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const timeShort = (t, span) => new Date(t).toLocaleString('en-US', span > 86400000
  ? { day: '2-digit', month: 'short' } : { hour: '2-digit', minute: '2-digit', hour12: false });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`; };

// ---------- tiles ----------
function renderTiles() {
  const k = state.key;
  $('keyLabel').textContent = k?.label || (state.provider === 'none' ? 'mode proxy' : '—');
  $('tTotal').textContent = usd(k?.usage);
  $('tTotalS').textContent = k?.freeTier ? 'free tier' : '';
  $('tDaily').textContent = usd(k?.daily);
  $('tWeekly').textContent = usd(k?.weekly);
  $('tMonthly').textContent = usd(k?.monthly);

  if (k?.limit != null) {
    const used = Math.max(0, k.limit - (k.remaining ?? 0));
    const pct = Math.min(100, (used / k.limit) * 100);
    $('tRemain').textContent = usd(k.remaining);
    $('tRemainS').textContent = `of ${usd(k.limit)}${k.limitReset ? ' · reset ' + k.limitReset : ''}`;
    const m = $('meter');
    m.style.width = pct + '%';
    m.style.background = pct >= 90 ? 'var(--crit)' : pct >= 75 ? 'var(--warn)' : 'var(--series-1)';
  } else {
    $('tRemain').textContent = k ? '∞' : '—';
    $('tRemainS').textContent = k ? 'no limit' : '';
    $('meter').style.width = '0';
  }

  // Burn rate from snapshots in the last hour (falls back to proxy cost).
  const now = Date.now(), hour = 3600000;
  const snaps = state.snapshots;
  const base = [...snaps].reverse().find((s) => s.t <= now - hour) || snaps.find((s) => s.t > now - hour);
  const cur = snaps.at(-1);
  let burn = null;
  if (base && cur && cur.t > base.t) burn = (cur.usage - base.usage) / Math.max(hour, cur.t - base.t) * hour;
  else if (!k) {
    const recent = state.requests.filter((r) => r.t > now - hour && r.cost != null);
    if (recent.length) burn = recent.reduce((a, r) => a + r.cost, 0);
  }
  $('tBurn').textContent = burn == null ? '—' : usd(burn) + '/h';
  $('tBurnS').textContent = burn == null ? 'waiting for data' : `≈ ${usd(burn * 24)}/day`;
}

function renderStatus() {
  const dot = $('dot'), txt = $('statusText'), err = $('error');
  if (state.error) {
    dot.className = 'dot err';
    txt.textContent = 'error';
    err.style.display = 'block';
    err.textContent = state.error;
  } else {
    err.style.display = 'none';
    dot.className = connected ? 'dot live' : 'dot';
    txt.textContent = !connected ? 'disconnected, retrying…'
      : state.lastPoll ? `live · update ${ago(state.lastPoll)}` : 'live';
  }
}

// ---------- charts ----------
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
}

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  parent?.appendChild(el);
  return el;
}

function frame(container) {
  container.innerHTML = '';
  const w = container.clientWidth, h = container.clientHeight;
  const m = { t: 8, r: 8, b: 22, l: 52 };
  const svg = svgEl('svg', { viewBox: `0 0 ${w} ${h}` }, container);
  const tip = document.createElement('div');
  tip.className = 'tip';
  container.appendChild(tip);
  return { svg, tip, w, h, m, iw: w - m.l - m.r, ih: h - m.t - m.b };
}

function yAxis(f, max, fmt) {
  const g = svgEl('g', { class: 'axis' }, f.svg);
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i, y = f.m.t + f.ih - (v / max) * f.ih;
    svgEl('line', { class: 'gridline', x1: f.m.l, x2: f.w - f.m.r, y1: y, y2: y }, g);
    svgEl('text', { x: f.m.l - 8, y: y + 4, 'text-anchor': 'end' }, g).textContent = fmt(v);
  }
}

function showTip(f, x, y, html) {
  f.tip.innerHTML = html;
  f.tip.style.display = 'block';
  const tw = f.tip.offsetWidth;
  f.tip.style.left = Math.min(Math.max(0, x - tw / 2), f.w - tw) + 'px';
  f.tip.style.top = Math.max(0, y - f.tip.offsetHeight - 10) + 'px';
}

function renderSpend() {
  const el = $('spendChart');
  const now = Date.now();
  let pts = state.snapshots;
  if (range) {
    const from = now - range;
    const before = [...pts].reverse().find((p) => p.t < from);
    pts = pts.filter((p) => p.t >= from);
    if (before) pts = [{ t: from, usage: before.usage }, ...pts];
  }
  if (pts.length && state.key) pts = [...pts, { t: now, usage: state.key.usage }];

  if (pts.length < 2) {
    el.innerHTML = `<div class="empty">${state.key ? 'No spend change in this range yet. The chart moves as soon as the token is used.' : state.provider === 'none' ? 'Proxy mode — cumulative spend is unavailable, see the request table below.' : 'Waiting for data…'}</div>`;
    $('spendSub').textContent = '';
    return;
  }

  const f = frame(el);
  const minU = pts[0].usage, maxU = pts.at(-1).usage;
  const delta = maxU - minU;
  const yMax = niceMax(delta || 0.0001);
  const t0 = range ? now - range : pts[0].t, t1 = now;
  const x = (t) => f.m.l + ((t - t0) / (t1 - t0 || 1)) * f.iw;
  const y = (u) => f.m.t + f.ih - ((u - minU) / yMax) * f.ih;
  $('spendSub').textContent = `+${usd(delta)} in this range`;

  yAxis(f, yMax, (v) => '+' + usd(v).replace(/0+$/, '').replace(/\.$/, ''));
  const ax = svgEl('g', { class: 'axis' }, f.svg);
  for (let i = 0; i <= 4; i++) {
    const t = t0 + ((t1 - t0) / 4) * i;
    svgEl('text', { x: x(t), y: f.h - 4, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle' }, ax)
      .textContent = timeShort(t, t1 - t0);
  }

  // Step line: spend jumps when a request settles, then holds.
  let d = `M${x(pts[0].t)},${y(pts[0].usage)}`;
  for (let i = 1; i < pts.length; i++) d += `H${x(pts[i].t)}V${y(pts[i].usage)}`;
  svgEl('path', { d: d + `V${f.m.t + f.ih}H${x(pts[0].t)}Z`, fill: 'var(--series-1)', opacity: 0.08 }, f.svg);
  svgEl('path', { d, fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2, 'stroke-linejoin': 'round' }, f.svg);
  const last = pts.at(-1);
  svgEl('circle', { cx: x(last.t), cy: y(last.usage), r: 4, fill: 'var(--series-1)', stroke: 'var(--surface)', 'stroke-width': 2 }, f.svg);

  // Hover: crosshair + value at that moment.
  const cross = svgEl('line', { y1: f.m.t, y2: f.m.t + f.ih, stroke: 'var(--muted)', 'stroke-dasharray': '3 3', visibility: 'hidden' }, f.svg);
  const hit = svgEl('rect', { x: f.m.l, y: f.m.t, width: f.iw, height: f.ih, fill: 'transparent' }, f.svg);
  hit.addEventListener('pointermove', (e) => {
    const r = f.svg.getBoundingClientRect();
    const px = e.clientX - r.left;
    const t = t0 + ((px - f.m.l) / f.iw) * (t1 - t0);
    const p = [...pts].reverse().find((p) => p.t <= t) || pts[0];
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    showTip(f, px, y(p.usage), `<b>${usd(p.usage)}</b> <span class="m">total</span><br><span class="m">${time(t)} · +${usd(p.usage - minU)}</span>`);
  });
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); f.tip.style.display = 'none'; });
}

function renderRequests() {
  const el = $('reqChart');
  const reqs = state.requests.slice(-60);
  const all = state.requests;
  const sum = (k) => all.reduce((a, r) => a + (r[k] || 0), 0);
  $('reqSub').textContent = all.length
    ? `${int(all.length)} request · ${compact(sum('prompt'))} in · ${compact(sum('completion'))} out${all.some((r) => r.cost != null) ? ' · ' + usd(sum('cost')) : ''}`
    : '';

  if (!reqs.length) {
    el.innerHTML = `<div class="empty"><div>No requests through the proxy yet.<br>Point your app's base URL at <code>${location.origin}/proxy/v1</code> to see per-request tokens in real time.</div></div>`;
    return;
  }

  const f = frame(el);
  const yMax = niceMax(Math.max(...reqs.map((r) => r.total)));
  yAxis(f, yMax, compact);
  const n = Math.max(reqs.length, 20);
  const slot = f.iw / n, bw = Math.max(2, Math.min(18, slot - 2));
  const y = (v) => (v / yMax) * f.ih;
  const base = f.m.t + f.ih;

  reqs.forEach((r, i) => {
    const cx = f.m.l + slot * (n - reqs.length + i) + slot / 2;
    const hIn = y(r.prompt), hOut = y(r.completion);
    // Input at the baseline, 2px surface gap, output stacked on top with a rounded end.
    svgEl('rect', { x: cx - bw / 2, y: base - hIn, width: bw, height: Math.max(0, hIn), fill: 'var(--series-1)' }, f.svg);
    if (hOut > 0) {
      const top = base - hIn - 2 - hOut;
      svgEl('path', { d: roundTop(cx - bw / 2, top, bw, hOut, Math.min(3, bw / 2, hOut)), fill: 'var(--series-2)' }, f.svg);
    }
    const hit = svgEl('rect', { x: cx - slot / 2, y: f.m.t, width: slot, height: f.ih, fill: 'transparent' }, f.svg);
    hit.addEventListener('pointerenter', () => showTip(f, cx, base - hIn - hOut,
      `<b>${esc(r.model || 'unknown')}</b><br>${int(r.prompt)} <span class="m">in</span> · ${int(r.completion)} <span class="m">out</span>${r.cost != null ? ' · ' + usd(r.cost) : ''}<br><span class="m">${time(r.t)} · ${(r.ms / 1000).toFixed(1)}s</span>`));
    hit.addEventListener('pointerleave', () => { f.tip.style.display = 'none'; });
  });
}

function roundTop(x, y, w, h, r) {
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function rowHtml(r) {
  return `<td>${time(r.t)}</td><td title="${esc(r.model)}">${esc(r.model) || '—'}</td><td>${int(r.prompt)}</td><td>${int(r.completion)}</td><td>${int(r.total)}</td><td>${r.cost != null ? usd(r.cost) : '—'}</td><td class="${r.status >= 400 ? 'bad' : ''}">${(r.ms / 1000).toFixed(1)}s</td>`;
}

function renderTable(newOne) {
  const body = $('reqBody');
  if (newOne) {
    const tr = document.createElement('tr');
    tr.className = 'new';
    tr.innerHTML = rowHtml(newOne);
    body.prepend(tr);
    while (body.children.length > 50) body.lastChild.remove();
    return;
  }
  body.innerHTML = state.requests.slice(-50).reverse().map((r) => `<tr>${rowHtml(r)}</tr>`).join('')
    || `<tr><td colspan="7" style="text-align:center;color:var(--muted)">—</td></tr>`;
}

function renderAll() { renderStatus(); renderTiles(); renderSpend(); renderRequests(); renderTable(); }

// ---------- realtime ----------
let connected = false;
const es = new EventSource('/events');
es.onopen = () => { connected = true; renderStatus(); };
es.onerror = () => { connected = false; renderStatus(); };
es.addEventListener('init', (e) => { Object.assign(state, JSON.parse(e.data)); renderAll(); });
es.addEventListener('status', (e) => { Object.assign(state, JSON.parse(e.data)); renderStatus(); renderTiles(); renderSpend(); });
es.addEventListener('snapshot', (e) => { state.snapshots.push(JSON.parse(e.data)); });
es.addEventListener('request', (e) => {
  const r = JSON.parse(e.data);
  if (!state.requests.length) $('reqBody').innerHTML = '';
  state.requests.push(r);
  renderRequests(); renderTable(r); renderTiles();
});

// Keep "x seconds ago" and the chart's moving time window fresh.
setInterval(() => { if (!document.hidden) { renderStatus(); if (range) renderSpend(); } }, 5000);

// ---------- controls ----------
document.querySelectorAll('#ranges button').forEach((b) => {
  b.setAttribute('aria-pressed', String(Number(b.dataset.r) === range));
  b.addEventListener('click', () => {
    range = Number(b.dataset.r);
    try { localStorage.setItem('range', range); } catch {}
    document.querySelectorAll('#ranges button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderSpend();
  });
});
$('resetBtn').addEventListener('click', () => fetch('/api/reset', { method: 'POST' }));
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { renderSpend(); renderRequests(); }, 150); });
</script>
</body>
</html>
